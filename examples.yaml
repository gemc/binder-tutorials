basic:
  - name: b1
    output_type: run
    nevents: 100
    g4camera: "[{phi: 0*deg, theta: 270*deg}]"
    header: "This example duplicates the geant4 basic example B1. 
             It uses the **dosimeter digitization**
             to store the accumulated dose on a detector."

  - name: b2
    output_type: event
    nevents: 10
    g4camera: "[{phi: 0*deg, theta: 270*deg}]"
    header: "This example duplicates the geant4 basic example B2. 
             It uses the **flux digitization**
             to save true and digitized information in the output. "

  - name: simple_flux
    output_type: event
    nevents: 100
    g4camera: "[{phi: 0*deg, theta: 270*deg}]"

optical:
  - name: cherenkov
    output_type: event
    nevents: 10
    g4camera: "[{phi: -10*deg, theta: 250*deg}]"
    header: "This example showcases the activation of the Cherenkov radiation in a GEMC detector."